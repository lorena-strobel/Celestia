{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro - Celestia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center" style="min-height:100vh;">

  <div class="card bg-secondary shadow-lg p-4" style="width: 100%; max-width: 420px;">
    <h2 class="text-center mb-4">Criar Conta</h2>

    <form method="POST">
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label">Usuário</label>
        <input type="text" name="username" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">E-mail</label>
        <input type="email" name="email" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Senha</label>
        <input type="password" name="senha" class="form-control" required>
      </div>

      <button type="submit" class="btn btn-warning w-100 fw-bold">Cadastrar</button>
    </form>

    <p class="text-center mt-3">
      Já tem conta?  
      <a href="{% url 'login' %}" class="text-warning fw-bold">Entrar</a>
    </p>
  </div>

</body>
</html>
